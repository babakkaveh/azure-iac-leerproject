name: Deploy capstone naar Azure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-capstone.yml'
  workflow_dispatch: {}   # laat je 'm ook handmatig starten vanuit de GitHub UI

permissions:
  id-token: write   # nodig voor OIDC login naar Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev   # koppel dit aan een GitHub Environment met eventueel een approval-gate
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, geen secrets met wachtwoorden nodig)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: rg-leerproject-dev
          template: infra/capstone/main.bicep
          parameters: infra/capstone/main.bicepparam adminPassword=${{ secrets.DEMO_ADMIN_PASSWORD }}
          deploymentMode: Incremental
