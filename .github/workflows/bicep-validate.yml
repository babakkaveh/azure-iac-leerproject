name: Bicep validate + what-if

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'

permissions:
  id-token: write   # nodig voor OIDC login naar Azure
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep lint
        run: az bicep build --file infra/capstone/main.bicep

      - name: Azure login (OIDC, geen secrets nodig)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: rg-leerproject-dev
          template: infra/capstone/main.bicep
          parameters: infra/capstone/main.bicepparam adminPassword=${{ secrets.DEMO_ADMIN_PASSWORD }}
          deploymentMode: Incremental
          additionalArguments: --what-if
